<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landmarks | Web Accessibility</title>
  </head>
  <body>
    <header>This content is part of the header</header>
    <main>
      <h1>Landmarks</h1>
      <p>This content is part of the main</p>

      <section aria-label="Section 1">
        <h2>Section 1</h2>
        <p>This content is part of a section</p>
      </section>
    </main>
    <footer>This content is part of the footer</footer>
  </body>
</html>
